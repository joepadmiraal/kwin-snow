name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            cmake ninja-build g++ pkg-config \
            libdrm-dev libwayland-dev wayland-protocols \
            extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev \
            libkf6config-dev libkf6configwidgets-dev \
            libkf6coreaddons-dev libkf6i18n-dev \
            libkf6kcmutils-dev libkf6windowsystem-dev \
            kwin-dev
          command -v pkg-config
          pkg-config --modversion libdrm

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify test-free configuration
        run: |
          cmake -B build-no-tests -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-no-tests --parallel
